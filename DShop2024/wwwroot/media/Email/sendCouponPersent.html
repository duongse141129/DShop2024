<html>
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title> Coupon Code Web Design</title>
    <meta name="description" content="">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h2>Dear {{UserName}}</h2>
    <h4>Thank you for registering an account at the {{ShopName}}. We send you a discount code.</h4>
    <div class="container" style="width: 100%; height: 100vh; background: #f0fff3; display: flex; align-items: center; justify-content: center;">
        <div class="coupon-card" style=" background: linear-gradient(135deg, #7158fe, #9d4de6); color: #fff; text-align: center; padding: 40px 80px; border-radius: 15px; box-shadow: 0 10px 10px 0 rgba(0,0,0,0.15); position: relative;">
            <h1 style=" font-size: 32px; font-weight: 600; line-height: 40px;">{{CouponName}}</h1>
            <h3 style=" font-size: 28px; font-weight: 400; line-height: 40px;">{{Description}}</h3>
            <di class="coupon-row" style=" display: flex; align-items: center; margin: 25px auto; width: fit-content;">
                <span id="cpnCode" style=" border: 1px dashed #fff; padding: 10px 20px; ">{{CouponCode}}</span>
            </di>
            <p style=" font-size: 15px;">Valid Till: {{DateExpire}}</p>
            <div class="circle1" style=" background: #f0fff3; width: 50px; height: 50px; border-radius: 50%; position: absolute; top: 50%; transform: translateY(-50%); left: -25px;"></div>
            <div class="circle2" style="background: #f0fff3; width: 50px; height: 50px; border-radius: 50%; position: absolute; top: 50%; transform: translateY(-50%); right: -25px; "></div>
        </div>
    </div>
    <div class="contact-info">
        <p>Thanks and best regards</p>
        <h4>{{ShopName}}</h4>
        <p>{{EmailShop}}</p>
        <p>{{HotlineShop}}</p>
        <img src=cid:{{Logo}} height="100" width="180" />
    </div>
</body>
</html>
