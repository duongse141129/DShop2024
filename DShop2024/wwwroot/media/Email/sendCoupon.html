<!DOCTYPE html>
<html>
<head>
    <base target="_top">
    <link href="Css/sendCouponC.css" rel="stylesheet" />
</head>
<body>
    <h2>Dear {{UserName}}</h2>
    <h4>Thank you for registering an account at the {{ShopName}}. We send you a discount code.</h4>
    <div class="coupon" style="border: 5px dotted #bbb; width: 80%; border-radius: 15px; margin: 0 auto; max-width: 600px;">
        <div class="container">
            <h3>{{CouponName}}</h3>
        </div>
        <div class="container" style="padding: 2px 16px; background-color: #f1f1f1;">
            <h2><b>{{Description}}</b></h2>
        </div>
        <div class="container" style="padding: 2px 16px; background-color: #f1f1f1;">
            <p>Use Promo Code: <span class="promo" style="background: #ccc; padding: 3px;">{{CouponCode}}</span></p>
            <p class="expire" style="color: red;">Expires: {{DateExpire}}</p>
        </div>
    </div>
    <div class="contact-info">
        <p>Thanks and best regards</p>
        <h4>{{ShopName}}</h4>
        <p>{{EmailShop}}</p>
        <p>{{HotlineShop}}</p>
        <img src=cid:{{Logo}} height="100" width="180" />
    </div>
</body>
</html>
